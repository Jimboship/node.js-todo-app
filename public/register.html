<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Register</title>
        <style>
            :root{
                --bg1:#6a11cb;
                --bg2:#2575fc;
                --card:#ffffff;
                --muted:#6b7280;
                --accent:#7c3aed;
            }
            *{box-sizing:border-box}
            body{
                margin:0;
                min-height:100vh;
                display:flex;
                flex-direction:column;
                justify-content:space-between;
                align-items:center;
                font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;
                background:linear-gradient(135deg,var(--bg1),var(--bg2));
                color:#111827;
                -webkit-font-smoothing:antialiased;
            }
            .footer{
                width:100%;
                padding:1rem 0;
                text-align:center;
                color:#ffffff;
                background: linear-gradient(90deg, #f97316, #ec4899);
                font-weight:700;
                box-shadow: inset 0 1px 0 rgba(255,255,255,0.16);
            }
            .container{
                width:100%;
                max-width:420px;
                padding:2rem;
            }
            .card{
                background:linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.98));
                border-radius:12px;
                padding:2rem;
                box-shadow:0 10px 30px rgba(2,6,23,0.35);
                border:1px solid rgba(12,18,36,0.06);
            }
            .brand{
                display:flex;
                align-items:center;
                gap:0.75rem;
                margin-bottom:1rem;
            }
            .logo{
                width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--bg2));
                box-shadow:0 6px 18px rgba(124,58,237,0.28);
            }
            h1{margin:0;font-size:1.25rem}
            p.lead{margin:0;margin-top:0.25rem;color:var(--muted);font-size:0.95rem}
            form{margin-top:1.25rem;display:grid;gap:0.75rem}
            label{font-size:0.85rem;color:var(--muted);display:block;margin-bottom:6px}
            .field{
                display:flex;flex-direction:column;
            }
            input[type="text"],input[type="password"]{
                width:100%;padding:0.75rem 0.9rem;border-radius:10px;border:1px solid rgba(15,23,42,0.08);
                background:transparent;font-size:0.98rem;outline:none;transition:box-shadow .15s,transform .05s;
            }
            input:focus{box-shadow:0 6px 18px rgba(37,117,252,0.12);border-color:rgba(37,117,252,0.45);}
            .actions{display:flex;align-items:center;gap:0.5rem;margin-top:0.5rem}
            button[type="submit"]{
                background:linear-gradient(90deg,var(--accent),var(--bg2));color:white;border:0;padding:0.75rem 1rem;border-radius:10px;font-weight:600;cursor:pointer;flex:1
            }
            button[type="submit"]:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(37,117,252,0.18)}
            .secondary{background:transparent;color:var(--muted);border:1px solid rgba(15,23,42,0.06);padding:0.6rem 0.8rem;border-radius:10px;cursor:pointer}
            .note{margin-top:0.75rem;font-size:0.85rem;color:var(--muted);text-align:center}
            .form-message{margin-top:0.75rem;min-height:1.2rem;color:#d93025;font-size:0.95rem;text-align:center;font-weight:600}
            @media (max-width:420px){.container{padding:1rem}.card{padding:1rem}}
        </style>
    </head>
    <body>
        <div class="container">
            <div class="card">
                <div class="brand">
                    <div class="logo" aria-hidden></div>
                    <div>
                        <h1>Create account</h1>
                        <p class="lead">Quickly create your account and get started.</p>
                    </div>
                </div>

                <form action="/register" method="post" autocomplete="on">
                    <div class="field">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" placeholder="your username" required aria-required="true" />
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Choose a strong password" required aria-required="true" />
                    </div>

                    <div class="actions">
                        <button type="submit">Create account</button>
                    </div>
                    <div id="form-message" class="form-message" role="alert"></div>
                </form>

                <p class="note">Already have an account? <a href="/login.html">Sign in</a></p>
            </div>
        </div>
        <footer class="footer">created by yongama|full stack developer</footer>
        <script src="/toggle.js"></script>
    </body>
</html>
